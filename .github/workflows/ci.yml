name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  audit-examples:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Clean example must pass
        run: uv run python main.py examples/clean-terraform --fail-on low -q -o -
      - name: Hardened example must pass hardened
        run: uv run python main.py examples/hardened-terraform --profile hardened --fail-on low -q -o -
      - name: Sample example must fail
        run: |
          if uv run python main.py examples/sample-terraform --fail-on high -q -o -; then
            echo "Expected the sample to fail the audit" && exit 1
          fi
