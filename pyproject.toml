[project]
name = "databricks-terraform-audit"
version = "0.2.0"
description = "Audits Databricks Terraform for security, standards and platform misconfigurations, and explains why each one matters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-hcl2>=4.0.0,<8",
    "click>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/stephen-a-nicholson/databricks-terraform-audit"
Issues = "https://github.com/stephen-a-nicholson/databricks-terraform-audit/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[project.scripts]
dbx-audit = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff.lint.per-file-ignores]
"docs/experiments/*.py" = ["I001", "SIM115", "E402", "E702", "E701", "PLR"]
