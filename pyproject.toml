[project]
name = "databricks-platform-ops-agent"
version = "0.1.0"
description = "Audits Databricks Terraform for security, standards and platform misconfigurations, and explains why each one matters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-hcl2>=4.0.0",
    "click>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/stephen-a-nicholson/databricks-platform-ops-agent"
Issues = "https://github.com/stephen-a-nicholson/databricks-platform-ops-agent/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[project.scripts]
dbx-audit = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
